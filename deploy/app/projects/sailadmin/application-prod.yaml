spring:
  config:
    import: configtree:/run/secrets/
  datasource:
    url: jdbc:mysql://mysql:3306/sail_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: sailadmin
  data:
    redis:
      host: redis
      port: 6379
      database: 0
server:
  port: 8080
sail:
  bootstrap:
    username: admin
  storage:
    local-root: /data/storage
  redis:
    namespace: sail-prod
    legacy-compatible: false
  websocket:
    allowed-origins: ${SAIL_SCHEME}://${SAIL_PUBLIC_HOST}
logging:
  file:
    name: /var/log/sailadmin/sail-admin.log
